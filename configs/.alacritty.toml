# Палитра Digitable — та же, что у схемы Vim configs/.vim/colors/digitable.vim.
# Шестнадцать цветов ANSI совпадают с g:terminal_ansi_colors из схемы байт в байт.

[colors.primary]
background = "#05080d"
foreground = "#f5f7fa"
dim_foreground = "#9baab8"
bright_foreground = "#f5f7fa"

[colors.cursor]
text = "CellBackground"
cursor = "#00e5e5"

[colors.vi_mode_cursor]
text = "CellBackground"
cursor = "#ffc247"

[colors.search.matches]
foreground = "#00e5e5"
background = "#042b30"

[colors.search.focused_match]
foreground = "#05080d"
background = "#ffc247"

[colors.hints.start]
foreground = "#05080d"
background = "#ffc247"

[colors.hints.end]
foreground = "#ffc247"
background = "#05080d"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "#f5f7fa"
background = "#15566a"

[colors.selection]
text = "CellForeground"
background = "#0f3745"

[colors.normal]
black = "#05080d"
red = "#ff5b5b"
green = "#7cff6b"
yellow = "#ffc247"
blue = "#3ca9ff"
magenta = "#b65cff"
cyan = "#00e5e5"
white = "#9baab8"

# Ярких вариантов у палитры нет, поэтому 9-13 и 15 повторяют 1-5 и 7 — как в
# схеме Vim. Исключение — 14: у палитры действительно два бирюзовых.
[colors.bright]
black = "#718695"
red = "#ff5b5b"
green = "#7cff6b"
yellow = "#ffc247"
blue = "#3ca9ff"
magenta = "#b65cff"
cyan = "#00d8ff"
white = "#f5f7fa"

[scrolling]
history = 50000
multiplier = 3

[window]
dynamic_padding = false
dynamic_title = true
opacity = 0.9

[window.dimensions]
columns = 0
lines = 0

[window.padding]
x = 35
y = 25

[window.position]
x = 50
y = 50

[font]
size = 18.0

[font.bold]
family = "Fira Code"
style = "Bold"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "Fira Code"
style = "Bold Italic"

[font.normal]
family = "MesloLGS NF"

[font.offset]
x = 0
y = 0
