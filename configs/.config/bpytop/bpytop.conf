#? Config file for bpytop v. 1.0.68

#* Color theme, looks for a .theme file in "/usr/[local/]share/bpytop/themes" and "~/.config/bpytop/themes", "Default" for builtin default theme.
#* Prefix name by a plus sign (+) for a theme located in user themes folder, i.e. color_theme="+monokai"
#* Без этой строки файл темы рядом лежит мёртвым грузом: bpytop берёт тему
#* только отсюда. Остальные ключи bpytop подставит сам значениями по умолчанию
#* и перепишет файл при выходе — так устроен его load_config.
color_theme="+digitable"
