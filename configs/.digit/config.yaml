# Read the shared skills directory that scripts/install-skills.sh fills, so the
# same SKILL.md files serve digit, Codex and Claude Code without a second copy.
# digit still keeps its own ~/.digit/skills; external dirs are mounted read-only,
# so nothing here is edited, archived or synced away from digit's side.
skills:
  external_dirs:
    - ~/.ai/skills
