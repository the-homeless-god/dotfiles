model:
  provider: custom
  base_url: http://127.0.0.1:8127/v1
  default: Qwen3-4B-Instruct-2507-Q4_K_M.gguf

# Read the shared skills directory that scripts/install-skills.sh fills, so the
# same SKILL.md files serve digit, Codex and Claude Code without a second copy.
# digit still keeps its own ~/.digit/skills; external dirs are mounted read-only,
# so nothing here is edited, archived or synced away from digit's side.
skills:
  external_dirs:
    - ~/.ai/skills

# Оформление. У digit свой движок скинов (digit_cli/skin_engine.py): активный
# выбирается ключом display.skin, а скин «digitable» digit несёт в себе —
# это его встроенный пресет, а не файл из этого репозитория. Поэтому здесь
# только имя: палитру, которой мы не владеем, переписывать нечего.
# Значение совпадает с сегодняшним умолчанием digit; строка нужна, чтобы
# умолчание могло поменяться, а оформление — нет.
display:
  skin: digitable
