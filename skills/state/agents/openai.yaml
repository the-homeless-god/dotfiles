interface:
  display_name: "State"
  short_description: "OKR-shaped status brief a human reads in ten seconds"
  default_prompt: "Use $state to report where this work stands: one objective line, three to six key results scored ✓/✗/? against declared thresholds, the blocker, what is needed from me — head under 14 lines and 900 characters — then a --- rule and the evidence below it."
